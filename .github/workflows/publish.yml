name: Build and Publish to Anaconda

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: "3.11"
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: build-env

      - name: Install conda-build and anaconda-client
        run: |
          conda install -y conda-build anaconda-client

      - name: Extract version from tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
            echo "Building version from tag: $VERSION"
          else
            echo "No version tag, using recipe default."
          fi

      - name: Build conda package
        run: |
          conda build conda-recipe \
            -c osdag \
            -c conda-forge \
            --no-test \
            --output-folder ./conda-dist

      - name: List built packages
        run: |
          find ./conda-dist -type f \( -name "*.conda" -o -name "*.tar.bz2" \)

      - name: Upload to Anaconda
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          PACKAGES=$(find ./conda-dist -type f \( -name "*.conda" -o -name "*.tar.bz2" \))
          if [ -z "$PACKAGES" ]; then
            echo "ERROR: No packages found to upload!"
            exit 1
          fi
          echo "Uploading: $PACKAGES"
          anaconda --token "$ANACONDA_API_TOKEN" upload --label main --skip-existing $PACKAGES
